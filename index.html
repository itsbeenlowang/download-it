 app:'<rect class="f" x="62" y="50" width="276" height="200" rx="18" style="fill-opacity:.1"/><circle class="a" cx="86" cy="73" r="5"/><circle class="l" cx="104" cy="73" r="5"/><circle class="l" cx="122" cy="73" r="5"/><rect class="l" x="80" y="94" width="58" height="140" rx="9" style="fill-opacity:.12"/><rect class="a" x="152" y="94" width="168" height="54" rx="11"/><rect class="l" x="152" y="160" width="80" height="74" rx="11"/><rect class="l" x="240" y="160" width="80" height="74" rx="11"/>'};
const cover=p=>`<div class="cv">${p.thumb?`<img src="${e(p.thumb)}" alt="${e(p.title)} preview" loading="lazy">`:`<svg class="art" viewBox="0 0 400 300" aria-hidden="true">${ART[p.type]||ART.pdf}</svg>`}<span class="chip">${e((p.type||'file').toUpperCase())}</span></div>`;
const lbl=a=>a>0?`Get it for $${fmt(a)}`:'Get it free';
const dlv=p=>p.price>0?(p.allowFree?'Instant if free, by email if paid':'By email after payment'):'Instant';
const card=(p,i)=>`<a class="card rise${i?'':' ft'}" style="--d:${.3+i*.08}s" href="${href(p.id)}" data-go="${e(p.id)}">${cover(p)}<div class="cb"><h3>${e(p.title)}</h3><p>${e(p.desc)}</p><div class="cf"><b>${p.price>0?'$'+fmt(p.price):'Free'}</b><span>${p.allowFree?'Name your price':e(dlv(p))}</span></div></div></a>`;
const home=()=>`<section class="hero"><h1 class="gt rise">Download it.</h1><p class="sub rise" style="--d:.08s">PDFs, zips and apps by ${CONFIG.main}. Pay with crypto, or take the free ones.</p>
<div class="chips rise" style="--d:.16s"><span class="chip">Binance</span><span class="chip">RedotPay</span><span class="chip mu">Card and PayPal soon</span><button class="btn sm" data-faq>How to pay</button></div></section>
<section><div class="sh"><h2>Files</h2><span class="mu">${PRODUCTS.length} available</span></div><div class="grid">${PRODUCTS.map(card).join('')}<div class="card soon rise" style="--d:${.3+PRODUCTS.length*.08}s"><span>${svg('plus')}</span><b>More files soon</b><small>Follow ${CONFIG.main} to see them first.</small></div></div></section>`;
const prod=p=>`<a class="back" href="${href('')}" data-go="">${svg('back',18)}All files</a>
<article class="pg"><div class="cvw rise">${cover(p)}</div><div class="rise" style="--d:.1s"><h1 class="gt">${e(p.title)}</h1><p class="lead">${e(p.desc)}</p>
<dl class="meta">${[...(p.meta||[]),['Delivery',dlv(p)]].map(([k,v])=>`<div><dt>${e(k)}</dt><dd>${e(v)}</dd></div>`).join('')}</dl>
<div class="buy">${p.allowFree?`<label class="amt" for="amt">Name your price</label><span class="in"><i>$</i><input id="amt" type="number" inputmode="decimal" min="0" step="0.5" value="${p.price}"></span><p class="hint">Type 0 to get it free.</p>`:`<p class="big">${p.price>0?'$'+fmt(p.price):'Free'}</p>`}
<button class="btn pri blk" id="get"><span id="gl">${lbl(p.price)}</span></button>
<div class="row2"><button class="btn sm" data-link>Copy link</button><button class="btn sm" data-mail="q">${svg('mail',16)}Ask a question</button></div>
${p.price>0?`<p class="hint" style="margin-bottom:0">Pay with ${PAY.filter(m=>!m.soon).map(m=>e(m.name)).join(' or ')}. <button data-faq>New to crypto?</button></p>`:''}</div></div></article>`;
const nf=()=>`<section class="hero"><h1 class="gt rise">Link not found</h1><p class="sub rise" style="--d:.08s">This link does not match a file. Check the address, or look at everything in the store.</p><div class="chips rise" style="--d:.16s"><a class="btn pri" href="${href('')}" data-go="">See all files</a><button class="btn" data-mail="g">${svg('mail',18)}Message me</button></div></section>`;

let P=null,S={},busy=0;
function seo(t,d,ld){document.title=t;$('meta[name=description]').content=d;let s=$('#ld');if(!s){s=document.createElement('script');s.id='ld';s.type='application/ld+json';document.head.append(s)}s.textContent=ld?JSON.stringify(ld):''}
function cur(){let h=decodeURIComponent(location.hash.replace(/^#\/?/,''));if(!h&&!local)h=decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g,'');return h.split('?')[0]}
function render(){
 const s=cur().toLowerCase();let v,t='Download it',d='PDFs, zips and apps. Pay with crypto, or take the free ones.';
 P=PRODUCTS.find(x=>[x.id,...(x.alias||[])].some(i=>i.toLowerCase()===s))||null;
 if(P){v=prod(P);t=P.title+' | Download it';d=P.desc}else if(!s||s==='index.html')v=home();else{v=nf();t='Link not found | Download it'}
 app.innerHTML=v;
 seo(t,d,P&&{'@context':'https://schema.org','@type':'Product',name:P.title,description:P.desc,offers:{'@type':'Offer',price:P.price,priceCurrency:'USD',availability:'https://schema.org/InStock'}});
 wire();
}
function go(s){if(local)location.hash='#/'+s;else{history.pushState(null,'','/'+s);render()}scrollTo(0,0)}
function wire(){
 const g=$('#get');if(!g)return;const i=$('#amt'),amt=()=>i?parseFloat(i.value):P.price;
 if(i)i.oninput=()=>{const a=amt();$('#gl').textContent=isNaN(a)?'Get it':lbl(a)};
 g.onclick=()=>{const a=amt();if(busy)return;if(isNaN(a)||a<0)return toast('Enter an amount, or 0 for free.');busy=1;setTimeout(()=>{busy=0;a>0?pay(P,a):free(P)},520)};
}
function show(h){$('#sc').innerHTML=h;ov.hidden=false;document.body.style.overflow='hidden';requestAnimationFrame(()=>requestAnimationFrame(()=>{ov.classList.add('open');$('#cl').focus()}))}
function hide(){ov.classList.remove('open');setTimeout(()=>{ov.hidden=true;document.body.style.overflow=''},320)}
function free(p){show(`<h2 id="st">Your file is ready</h2><p class="mu">${e(p.title)}</p>${p.file?`<a class="btn pri blk" style="margin-top:20px" href="${e(p.file)}" download target="_blank" rel="noopener">Download</a>`:'<p class="warn">No file link is set for this product yet.</p>'}<p class="hint" style="margin-top:18px">Enjoying it? Find me as ${CONFIG.main}.</p>`)}
function pay(p,a){S={p,a,m:PAY.find(x=>!x.soon).id,ref:p.id.toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()};show(paySheet())}
function paySheet(){
 const m=PAY.find(x=>x.id===S.m);
 return `<h2 id="st">Pay ${fmt(S.a)} USDT</h2><p class="mu">${e(S.p.title)}</p>
<div class="mths" role="radiogroup" aria-label="Payment method">${PAY.map(x=>`<button class="mth${x.id===S.m?' on':''}" role="radio" aria-checked="${x.id===S.m}" data-m="${x.id}"${x.soon?' disabled':''}>${e(x.name)}${x.soon?'<small>Coming soon</small>':''}</button>`).join('')}</div>
<div class="cp"><div><small>Amount</small><code>${fmt(S.a)} USDT</code></div><button class="btn sm" data-cp="${fmt(S.a)}" data-t="Amount copied">Copy</button></div>
<div class="cp"><div><small>USDT address</small><code>${e(m.value)}</code></div><button class="btn sm" data-cp="${e(m.value)}" data-t="Address copied">Copy</button></div>
<p class="warn">Network: ${e(NET)}. Another network can lose your money.</p>
<h3>Steps</h3><ol class="s">${m.steps.map(t=>`<li>${e(t)}</li>`).join('')}</ol>
<div class="cp"><div><small>Reference, add it to the note if you can</small><code>${e(S.ref)}</code></div><button class="btn sm" data-cp="${e(S.ref)}" data-t="Reference copied">Copy</button></div>
<h3>Then tell me you paid</h3><input id="em" type="email" placeholder="Your email" autocomplete="email"><input id="tx" placeholder="Transaction ID (optional)">
<button class="btn pri blk" id="pf" style="margin-top:14px">${svg('mail',18)}Send proof by email</button><p class="hint" style="margin-bottom:0">I confirm it by hand, then email your download link.</p>`}
const msg=()=>{const m=PAY.find(x=>x.id===S.m);return `Order ${S.ref}\nFile: ${S.p.title} (${url(S.p.id)})\nPaid: ${fmt(S.a)} USDT via ${m.name} on ${NET}\nTransaction ID: ${$('#tx').value||'-'}\nMy email: ${$('#em').value}`};
const okMail=()=>/^\S+@\S+\.\S+$/.test($('#em').value)||(toast('Add your email so I can send the file.'),$('#em').focus(),false);
const copy=(t,m='Copied')=>{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(m),()=>prompt('Copy this:',t))};
const toast=m=>{const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('on'),2200)};
const mail=(s,b)=>{location.href='mailto:'+atob(CONFIG.mail)+'?subject='+encodeURIComponent(s)+'&body='+encodeURIComponent(b);toast('Opening your email app')};
$('#sc').addEventListener('click',ev=>{
 const t=ev.target.closest('button');if(!t)return;
 if(t.dataset.m){const em=$('#em').value,tx=$('#tx').value;S.m=t.dataset.m;$('#sc').innerHTML=paySheet();$('#em').value=em;$('#tx').value=tx}
 else if(t.id==='pf'&&okMail())mail('Payment '+S.ref,msg());
});
/* click FX: pixel burst, ported from the guide (block noise from the click point, clipped to the button) */
function burst(b,ev){
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const r=b.getBoundingClientRect(),dp=Math.min(devicePixelRatio||1,2),c=document.createElement('canvas'),W=c.width=Math.round(r.width*dp),H=c.height=Math.round(r.height*dp);
 c.className='fx';b.append(c);
 const g=c.getContext('2d'),x=(ev.detail?ev.clientX-r.left:r.width/2)*dp,y=(ev.detail?ev.clientY-r.top:r.height/2)*dp,s=7*dp,t0=performance.now(),
 Rm=Math.max(...[[0,0],[W,0],[0,H],[W,H]].map(([p,q])=>Math.hypot(p-x,q-y))),
 hs=(a,b,c)=>{const q=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return q-Math.floor(q)};
 (function f(now){
  const tt=now-t0,u=Math.min(tt/900,1);g.clearRect(0,0,W,H);
  if(u>=1)return c.remove();
  const R=(1-Math.pow(1-u,4))*Rm,fl=Math.floor(tt/42),w=Rm*.45+8*dp;
  for(let i=0;i<W/s;i++)for(let j=0;j<H/s;j++){
   const d=Math.hypot(i*s+s/2-x,j*s+s/2-y),k=Math.exp(-(((d-R)/w)**2))*(1-u)**1.2,h=hs(i,j,fl),a=k*(.2+1.1*h)-.1;
   if(a>0){g.fillStyle=(h>.5?'rgba(255,255,255,':'rgba(3,35,42,')+Math.min(a,.9)+')';g.fillRect(i*s,j*s,s-dp,s-dp)}}
  requestAnimationFrame(f)})(t0);
}
document.addEventListener('click',ev=>{
 const t=ev.target;let x;
 if((x=t.closest('[data-go]'))&&!ev.metaKey&&!ev.ctrlKey&&!ev.shiftKey){ev.preventDefault();go(x.dataset.go)}
 if(x=t.closest('[data-cp]'))copy(x.dataset.cp,x.dataset.t||'Copied');
 if(t.closest('[data-link]')&&P)copy(url(P.id),'Link copied');
 if(x=t.closest('[data-mail]')){const q=x.dataset.mail==='q'&&P;mail(q?'Question about '+P.title:'Hello from Download it',q?`Hi, I have a question about "${P.title}" (${url(P.id)}).\n\n`:'Hi,\n\n')}
 if(t.closest('[data-faq]'))$('#faq').scrollIntoView({behavior:'smooth'});
 if(x=t.closest('.qb')){const o=x.parentElement.classList.toggle('open');x.setAttribute('aria-expanded',o)}
 if(x=t.closest('.btn')){x.classList.remove('press');void x.offsetWidth;x.classList.add('press');if(x.classList.contains('pri'))burst(x,ev)}
});
ov.onclick=ev=>{if(ev.target===ov)hide()};$('#cl').onclick=hide;
addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!ov.hidden)hide()});
$('#tt').onclick=()=>{const r=document.documentElement,t=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=t;try{localStorage.t=t}catch{}};
try{if(localStorage.t)document.documentElement.dataset.theme=localStorage.t}catch{}
$('#tt').innerHTML=svg('th');$('#cl').innerHTML=svg('x',18);
$('#hm').innerHTML=svg('mail',18)+'<span class="hide-s">Message me</span>';$('#fm').innerHTML=svg('mail',16)+'Message me';
$('#faq').innerHTML=`<div class="sh"><h2 id="fh">How to pay</h2><span class="mu">Tap a question</span></div>`+FAQ.map((x,i)=>`<div class="q"><button class="qb" aria-expanded="false" aria-controls="a${i}">${e(x.q)}</button><div class="ans" id="a${i}" role="region"><div>${x.p?`<p>${e(x.p)}</p>`:''}${x.s?`<ol class="s">${x.s.map(t=>`<li>${e(t)}</li>`).join('')}</ol>`:''}${x.n?`<p class="note">${e(x.n)}</p>`:''}${x.btn?`<button class="btn sm" data-mail="g">${svg('mail',16)}Message me</button>`:''}</div></div></div>`).join('');
addEventListener('popstate',render);addEventListener('hashchange',render);
render();
